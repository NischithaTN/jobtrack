<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTrack | Job Application Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>JobTrack</h1>
<p>Your job search, organized.</p>
</header>
<main>
<section class="welcome">
<h2>Welcome to JobTrack 👋</h2>
<p>Track applications, manage interviews, and organize your career journey.</p>
<button id="startBtn">Get Started</button>
</section>
<section class="stats">
<div class="stat-card"><h3>Total Applications</h3><p id="total">0</p></div>
<div class="stat-card"><h3>Interviews</h3><p id="interviews">0</p></div>
<div class="stat-card"><h3>Offers</h3><p id="offers">0</p></div>
</section>
<section id="applicationSection">
<h2>Your Applications</h2>
<p id="emptyMessage">Your applications will appear here.</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
